<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="無界塾六年級 Google 協作網站。依 D、B、G 班查看學生發布的網站。" />
  <title>無界塾六年級 Google 協作網站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#works">跳到學生網站</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#top">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text">
          <span class="brand__kicker">無界塾</span>
          <span class="brand__name">六年級協作網站</span>
        </span>
      </a>
      <a class="topbar__jump" href="#works">看學生網站</a>
    </div>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="page-title">
      <p class="hero__eyebrow">資訊 · 發布 · 表達</p>
      <h1 id="page-title" class="hero__title">無界塾六年級 Google 協作網站</h1>
      <p class="hero__lede">
        這學期六年級學生學習用 Google 協作平台做出自己的網站：選定主題、安排頁面與導覽，再發布成一個真正可以打開的網址。這裡依 D、B、G 班收錄每位學生的網站。
      </p>
    </section>

    <section id="works" class="works" aria-label="學生網站">
      <div class="filter-bar" id="filter-bar">
        <nav class="class-tabs" role="tablist" aria-label="班級篩選">
          <button type="button" class="class-tab is-active" role="tab" aria-selected="true" data-class="all">全部</button>
          <button type="button" class="class-tab" role="tab" aria-selected="false" data-class="D">D 班</button>
          <button type="button" class="class-tab" role="tab" aria-selected="false" data-class="B">B 班</button>
          <button type="button" class="class-tab" role="tab" aria-selected="false" data-class="G">G 班</button>
        </nav>
        <label class="search">
          <span class="visually-hidden">搜尋學生姓名</span>
          <input id="search-input" type="search" placeholder="輸入孩子的姓名" autocomplete="off" />
        </label>
      </div>

      <p class="works__count" id="works-count" aria-live="polite"></p>
      <div id="student-grid" class="student-grid" aria-label="學生網站列表"></div>
      <p id="empty-state" class="empty-state" hidden>找不到符合的學生，請改班級或再試一次姓名。</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>無界塾六年級 · Google 協作網站 · 教育展示用</p>
  </footer>

  <div class="modal" id="preview-modal" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__header">
        <div>
          <p class="modal__class" id="modal-class"></p>
          <h3 id="modal-title">網站預覽</h3>
          <p class="modal__site" id="modal-site"></p>
        </div>
        <button type="button" class="modal__close" data-close-modal aria-label="關閉">×</button>
      </div>
      <div class="modal__frame-wrap">
        <iframe id="modal-frame" title="網站預覽" src="" allowfullscreen allow="fullscreen"></iframe>
      </div>
      <div class="modal__note">
        <p id="modal-note">請用下方連結另開分頁。若出現登入畫面，請先登入學校帳號，或請學生把發布範圍改成「知道連結的任何人都可以檢視」。</p>
        <a id="modal-open" href="#" target="_blank" rel="noopener noreferrer">在新分頁開啟網站</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
